<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f6f0e3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="OralCompass" />
    <!-- black-translucent: the page runs under the status bar; styles/safe-area.css pads the top inset and backs the white status text with ink -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OralCompass" />
    <title>OralCompass</title>
    <link rel="icon" href="/art/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/art/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/art/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/art/journey-backdrop.webp" fetchpriority="high" media="(min-width: 761px)" />
    <!-- the My journey plate at the phone size: the same AVIF srcset/sizes the CinematicStage <picture> offers (lib/art-srcset), so the
         preload is the file the page uses; no href, so a browser without imagesrcset or AVIF skips it rather than fetching the original -->
    <link rel="preload" as="image" type="image/avif" imagesrcset="/art/journey-passage-480.avif 480w, /art/journey-passage-720.avif 720w, /art/journey-passage-960.avif 960w" imagesizes="min(100vw, 480px)" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
